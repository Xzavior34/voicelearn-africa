  <path d="M10 16v0M13 13v6M16 10v12M19 13v6M22 16v0" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  {/* Active green status pulse dot */}
  <circle cx="24" cy="8" r="2.5" fill="#10b981" />
  <circle cx="24" cy="8" r="3.5" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5" />
</svg>
